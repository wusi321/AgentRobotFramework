# ARF Hardware Configuration

motor:
  - id: 1
    type: pwm_motor
    pwm_channel: 1
    reverse: false
    max_speed: 0.8
  
  - id: 2
    type: pwm_motor
    pwm_channel: 2
    reverse: false
    max_speed: 0.8

servo:
  - id: 1
    type: pwm_servo
    pwm_channel: 3
    min_angle: 0
    max_angle: 180
    default_angle: 90

sensor:
  imu:
    type: mpu6050
    interface: i2c
    address: 0x68
    frequency_hz: 100
  
  ultrasonic:
    trigger_pin: PA1
    echo_pin: PA2
    max_distance_cm: 400
